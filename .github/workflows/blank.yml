name: Deploy to GKE

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Authenticate with Google Cloud
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_KEY }}

    - name: Set up Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v1.1.0
      with:
        version: 'latest'

    - name: Set GCP Project
      run: gcloud config set project cloudside-academy

    - name: Get GKE credentials
      run: sudo gcloud container clusters get-credentials ga-gke-ss-46 --zone us-central1-c --project cloudside-academy

    - name: Deploy to GKE
      run: |
        kubectl apply -f kubernetes/deployment.yaml
